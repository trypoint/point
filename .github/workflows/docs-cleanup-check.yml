name: Docs cleanup verification

on:
  push:
    branches:
      - docs/cleanup-01

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, xml, simplexml, dom
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - run: composer install --no-progress --prefer-dist --no-interaction
      - run: composer check-platform-reqs
      - run: composer dump-autoload -o --strict-psr
      - run: composer test
      - run: composer stan
      - name: Confirm 79-file distribution and license
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar HEAD > /tmp/point-docs-cleanup.tar
          tar -tf /tmp/point-docs-cleanup.tar | grep -v '/
          test "$(grep -v '/$' /tmp/export-paths.txt | wc -l)" -eq 79
          grep -Fxq 'LICENSE' /tmp/export-paths.txt
          ! grep -Fxq 'LICENSE.md' /tmp/export-paths.txt
          grep -Fxq 'docs/migration-from-slim.md' /tmp/export-paths.txt
 > /tmp/export-paths.txt
          test "$(grep -v '/$' /tmp/export-paths.txt | wc -l)" -eq 79
          grep -Fxq 'LICENSE' /tmp/export-paths.txt
          ! grep -Fxq 'LICENSE.md' /tmp/export-paths.txt
          grep -Fxq 'docs/migration-from-slim.md' /tmp/export-paths.txt
